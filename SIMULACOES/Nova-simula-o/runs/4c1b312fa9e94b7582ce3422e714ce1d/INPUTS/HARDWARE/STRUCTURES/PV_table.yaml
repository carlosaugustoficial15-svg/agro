StructureType:
  Value: PV Table
  Type: string
  Choices: [Agrivoltaic Fence, PV Table, HSATS]
  Definition: which type of structure for the PV modules
Material:
  Value: Wood
  Type: string
  Choices: [Metal, Wood]
  Definition: used to apply texture to the structure ;
    Metal -> grey structure
    Wood -> brown structure
NumberOfStructureGroups:
  Value: 3
  Type: integer
  Limit: [1, 100]
  Unit: dimensionless [-]
  Definition: Number of structure groups in one PV block
RepetitionDistanceGroupYMode:
  Value: auto
  Type: string
  Choices: [ auto, manual ]
  Definition: Choose how the repetition distance of structure groups along Y axis is
    handled.
    - auto means the software adjusts the structure layout to the panels layout
    - manual requires the RepetitionDistanceGroupY to be provided by the user
RepetitionDistanceGroupY:
  Value: 6.2
  Type: float
  Limit: [ 0.0, 50.0 ]
  Unit: meters [m]
  Definition: spacing of structure groups along Y. Only used when
    RepetitionDistanceGroupYMode is set to manual.
PoleShape:
  Value: square
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the pole profile
PoleWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: Pole size along x (used in rectangular pole)
PoleHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: Pole size along y (used in rectangular pole)
PoleSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in square pole)
PoleRadius:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole radius (used in cylindrical pole)
PoleGroundPositioning:
  Value: -0.50
  Type: float
  Limit: [-10, 0]
  Unit: meters [m]
  Definition: vertical positioning of the pole relative to the ground ;
    0 is flush with the ground, negative values mean the pole base is below
    ground level.
PoleSpacingX:
  Value: 2.0
  Type: float
  Limit: [0.2,4.0]
  Unit: meters [m]
  Definition: the distance between the two poles on x axis
PurlinShape:
  Value: square
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the purlin profile
PurlinWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: purlin size along x (used in rectangular purlin)
PurlinHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: purlin size along y (used in rectangular purlin)
PurlinSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in square purlin)
PurlinRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Purlin radius (used in cylindrical purlin)
NumberOfPurlins:
  Value: 5
  Type: integer
  Limit: [1, 10]
  Definition: Number of Purlin for one group
RafterShape:
  Value: square
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the rafter profile
RafterWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: rafter size along x (used in rectangular rafter)
RafterHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: rafter size along y (used in rectangular rafter)
RafterSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in square rafter)
RafterLength:
  Value: 2.50
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: rafter length
RafterRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: rafter radius (used in cylindrical rafter)
DiagonalShape:
  Value: Cylinder
  Type: string
  Choices: [Square, Rectangle, Cylinder]
  Definition: shape of the diagonal profile
DiagonalWidth:
  Value: 0.2
  Type: float
  Limit: [0.01, 10.0]
  Unit: meters [m]
  Definition: diagonal size along x (used in rectangular diagonal)
DiagonalHeight:
  Value: 0.2
  Type: float
  Limit: [0.05, 10.0]
  Unit: meters [m]
  Definition: diagonal size along y (used in rectangular diagonal)
DiagonalSide:
  Value: 0.1
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: Pole side length (used in square diagonal)
DiagonalRadius:
  Value: 0.05
  Type: float
  Limit: [0.01, 50.0]
  Unit: meters [m]
  Definition: diagonal radius (used in cylindrical diagonal)
DiagonalEpsilon:
  Value: 0.000001
  Type: float
  Limit: [0.000001, 0.000002]
  Unit: dimensionless [-]
  Definition: diagonal epsilon (used in cylindrical diagonal)
DiagonalGroundGuard:
  Value: 0.0
  Type: float
  Limit: [0.0, 10.0]
  Unit: meters [m]
  Definition: minimum height above ground of the diagonal lower endpoint.
    0 means the diagonal bottom sits at ground level; positive values raise it
    by the specified distance above the ground.
